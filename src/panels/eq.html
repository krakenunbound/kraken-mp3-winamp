<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kraken EQ</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--panel-bg-dark);
        }
        body.eq-standalone .eq-titlebar {
            -webkit-app-region: drag;
        }
        body.eq-standalone .panel-titlebar-btns,
        body.eq-standalone .eq-body,
        body.eq-standalone button,
        body.eq-standalone select,
        body.eq-standalone input {
            -webkit-app-region: no-drag;
        }
        .eq-standalone-root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .eq-standalone-root .winamp-panel {
            flex: 1;
            border: none;
        }
    </style>
</head>
<body class="eq-standalone theme-square">
    <div class="eq-standalone-root">
        <div class="winamp-panel eq-panel" id="eqPanel">
            <div class="panel-titlebar eq-titlebar" id="eqTitleBar">
                <div class="panel-title-text">KRAKEN EQUALIZER</div>
                <div class="panel-titlebar-btns">
                    <button type="button" class="title-panel-btn dock-lock-btn is-locked" data-panel="eq" title="Locked below main player — click to detach" aria-label="Dock lock">
                        <svg class="dock-lock-icon" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true">
                            <g class="lock-closed"><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none"/><rect x="4" y="7" width="8" height="6" rx="0.5"/></g>
                            <g class="lock-open"><path d="M5.5 7V4.5a2.5 2.5 0 0 1 5 0" fill="none"/><rect x="4" y="7" width="8" height="6" rx="0.5"/></g>
                        </svg>
                    </button>
                    <button class="title-panel-btn close-btn" id="btnEqClose" title="Close">×</button>
                </div>
            </div>
            <div class="eq-body">
                <div class="eq-top-row">
                    <div class="eq-top-left">
                        <button class="eq-ctrl-btn" id="eqToggle" title="Toggle EQ On/Off">ON</button>
                        <button class="eq-ctrl-btn" id="eqReset" title="Reset all bands">RESET</button>
                    </div>
                    <div class="eq-top-right">
                        <select id="eqPreset" class="eq-preset-sel">
                            <option value="flat">Flat</option>
                            <option value="rock">Rock</option>
                            <option value="pop">Pop</option>
                            <option value="jazz">Jazz</option>
                            <option value="classical">Classical</option>
                            <option value="bass-boost">Bass Boost</option>
                            <option value="custom">Custom</option>
                        </select>
                        <span class="eq-presets-label">PRESETS</span>
                    </div>
                </div>
                <div class="eq-sliders-row">
                    <div class="eq-db-scale">
                        <span>+12</span>
                        <span>0</span>
                        <span>-12</span>
                    </div>
                    <div class="eq-band preamp-band">
                        <input type="range" class="eq-v-slider" id="eqPreamp" min="-12" max="12" step="0.5" value="0" aria-label="Preamp">
                        <span class="eq-band-lbl">PREAMP</span>
                    </div>
                    <div class="eq-divider"></div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="0" aria-label="31 Hz">
                        <span class="eq-band-lbl">31</span>
                    </div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="1" aria-label="62 Hz">
                        <span class="eq-band-lbl">62</span>
                    </div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="2" aria-label="125 Hz">
                        <span class="eq-band-lbl">125</span>
                    </div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="3" aria-label="250 Hz">
                        <span class="eq-band-lbl">250</span>
                    </div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="4" aria-label="500 Hz">
                        <span class="eq-band-lbl">500</span>
                    </div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="5" aria-label="1 kHz">
                        <span class="eq-band-lbl">1K</span>
                    </div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="6" aria-label="2 kHz">
                        <span class="eq-band-lbl">2K</span>
                    </div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="7" aria-label="4 kHz">
                        <span class="eq-band-lbl">4K</span>
                    </div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="8" aria-label="8 kHz">
                        <span class="eq-band-lbl">8K</span>
                    </div>
                    <div class="eq-band">
                        <input type="range" class="eq-v-slider eq-slider" min="-12" max="12" step="0.5" value="0" data-band="9" aria-label="16 kHz">
                        <span class="eq-band-lbl">16K</span>
                    </div>
                </div>
                <div class="eq-status-row">
                    <span id="eqPreampVal" class="eq-preamp-val">0 dB preamp</span>
                </div>
            </div>
        </div>
    </div>
    <script src="eq-renderer.js"></script>
</body>
</html>

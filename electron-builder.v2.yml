appId: com.krakenunbound.mp3player.v2
productName: Kraken MP3
copyright: Copyright © Kraken Unbound
directories:
  output: dist
files:
  - src/**/*
  - assets/icons/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  icon: assets/icons/icon.ico
  legalTrademarks: Kraken Unbound
  executableName: Kraken MP3
nsis:
  include: build/installer-v2.nsh
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: true
  runAfterFinish: true
  installerIcon: assets/icons/icon.ico
  uninstallerIcon: assets/icons/icon.ico
  shortcutName: Kraken MP3
portable:
  artifactName: ${productName} ${version}.${ext}
